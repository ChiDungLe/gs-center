<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genius Scientist – Sơ đồ vị trí bảng tuần hoàn</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#0b5560;--teal:#1e9090;--sky:#17b8dc;--sun:#ffe11a;--paper:#fff;--cell-text:#0b5560}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Baloo 2','Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;position:relative}
.blob{position:fixed;pointer-events:none;z-index:0}
.blob.tr{top:0;right:0;width:min(13vw,190px)}
.blob.br{bottom:0;right:0;width:min(13vw,190px)}
.app{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-columns:clamp(250px,25vw,330px) 1fr}

/* ---------- Cột trái ---------- */
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(5px,1.2vh,12px);padding:clamp(8px,1.8vh,20px) 14px;overflow-y:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.logo{width:clamp(60px,12vh,104px);height:clamp(60px,12vh,104px);border-radius:50%;padding:0;border:0;background:none;flex:none;cursor:pointer;transition:transform .12s;-webkit-tap-highlight-color:transparent}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
.logo:active{transform:scale(.93)}
.brand{font-weight:700;font-size:clamp(14px,2.4vh,19px);line-height:1.1}
.brand small{display:block;font-weight:500;font-size:.78em}
h1{font-weight:800;line-height:.88;font-size:clamp(34px,6.6vh,64px);letter-spacing:-1px}
h1 .g{color:var(--ink);text-shadow:0 4px 0 rgba(11,85,96,.22)}
h1 .e{color:var(--sky);text-shadow:0 4px 0 rgba(23,184,220,.25)}
.sub{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;letter-spacing:5px;font-size:clamp(12px,2vh,17px)}
.sub i{display:block;width:24px;height:3px;background:var(--ink);border-radius:2px}
.tag{font-style:italic;font-weight:700;font-size:clamp(12px,2vh,15px);line-height:1.15}
.count{display:flex;align-items:baseline;justify-content:center;gap:8px;width:100%;padding:0 12px 2px;border:3px solid var(--ink);border-radius:999px;background:var(--sun);box-shadow:0 4px 0 var(--ink);font-weight:800}
.count small{font-size:clamp(12px,1.9vh,16px);font-weight:700}
.count b{font-size:clamp(26px,5.2vh,42px);line-height:1.1;font-variant-numeric:tabular-nums}
.count b.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.25)}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;width:100%;text-align:left;font-size:clamp(10px,1.65vh,13px);font-weight:500;line-height:1.1}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;flex:none;border-radius:4px;border:2px solid var(--ink)}
.tools{margin-top:auto;padding-top:6px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tbtn{width:clamp(44px,6.6vh,54px);height:clamp(44px,6.6vh,54px);display:grid;place-items:center;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:50%;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .12s;padding:0}
.tbtn svg{width:58%;height:58%}
.tbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.tbtn:focus-visible,.logo:focus-visible,.cell:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#hl[aria-pressed="true"]{background:#fff}
#hl[aria-pressed="true"] .rays{opacity:.25}
.sync{position:fixed;left:10px;bottom:10px;z-index:5;display:flex;align-items:center;gap:6px;pointer-events:none;font-size:12px;font-weight:700;line-height:1}
.sync i{width:9px;height:9px;border-radius:50%;background:#e5a100;flex:none;box-shadow:0 0 0 2px #fff}
.sync span{display:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 9px}
.sync:not([data-s="live"]) span{display:block}
.sync[data-s="live"] i{background:#1fa55a}
.sync[data-s="off"] i{background:#e5322d}

/* ---------- Khung 30 vị trí ---------- */
.board{height:100vh;height:100dvh;padding:clamp(8px,1.8vh,18px) clamp(10px,1.8vw,22px) clamp(12px,2.2vh,22px) 4px}
.grid{height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);gap:clamp(7px,1.5vh,13px)}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;border:3px solid var(--ink);border-radius:18px;padding:2px 4px;text-align:center;background:var(--bg);box-shadow:0 5px 0 var(--ink);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .15s,box-shadow .15s}
@media(hover:hover){
  .logo:hover{transform:scale(1.05)}
  .tbtn:hover{transform:translateY(-2px)}
  .cell:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
}
.cell.press{transform:translateY(5px);box-shadow:0 0 0 var(--ink);transition-duration:.06s}
.cell.sel{outline:5px solid #ff7a00;outline-offset:3px}
.grid.hide-sel .cell.sel{outline-color:transparent}
.num{position:absolute;top:5px;left:7px;min-width:clamp(22px,3.6vh,30px);height:clamp(22px,3.6vh,30px);border-radius:50%;background:var(--ink);color:var(--sun);font-weight:800;font-size:clamp(12px,2vh,16px);display:grid;place-items:center;padding:0 4px}
.sym{font-weight:800;font-size:clamp(26px,6vh,58px);line-height:1;color:var(--fg,var(--cell-text))}
.nm{font-size:clamp(10px,1.8vh,15px);font-weight:700;opacity:.88;margin-top:2px;color:var(--fg,var(--cell-text))}
.alk{--bg:#9fe0d8}.alke{--bg:#7fd0cc}.tm{--bg:#1e9090;--fg:#fff}.mtl{--bg:#cfeff2}.met{--bg:#b6e3ee}.nm1{--bg:#fff6a6}.hal{--bg:#ffe11a}.ng{--bg:#17b8dc;--fg:#fff}
.cell.out{outline:0;--bg:#e5322d;--fg:#fff;cursor:default;pointer-events:none;border-color:#7a0f0c;box-shadow:0 5px 0 #7a0f0c;animation:out .6s ease both}
.cell.out.still{animation:none}
.cell.out::after{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(to top right,transparent calc(50% - 3px),rgba(255,255,255,.85) calc(50% - 3px),rgba(255,255,255,.85) calc(50% + 3px),transparent calc(50% + 3px))}
.cell.out .num{background:#7a0f0c;color:#fff}
@keyframes out{0%{transform:scale(1)}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px) rotate(-2deg)}80%{transform:translateX(3px)}100%{transform:none}}

/* Màn hình hẹp / dọc: xếp chồng và cho phép cuộn */
@media(max-width:820px),(max-aspect-ratio:1/1){
  body{overflow:auto}
  .app{grid-template-columns:1fr;height:auto}
  .side{overflow:visible;padding:14px}
  .board{height:auto;padding:8px 8px 20px}
  .grid{height:auto;grid-auto-rows:minmax(86px,auto);grid-template-rows:none;gap:8px}
  .cell{border-width:2px;border-radius:14px}
  .tools{margin-top:6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      <span><i style="background:#1e9090"></i>Kim loại chuyển tiếp</span>
      <span><i style="background:#b6e3ee"></i>Kim loại khác</span>
      <span><i style="background:#cfeff2"></i>Á kim</span>
      <span><i style="background:#fff6a6"></i>Phi kim</span>
      <span><i style="background:#ffe11a"></i>Halogen</span>
      <span><i style="background:#17b8dc"></i>Khí hiếm</span>
    </div>

    <div class="tools">
      <button class="tbtn" id="all" type="button" aria-label="Chọn tất cả vị trí chưa bị loại" title="Chọn tất cả vị trí chưa bị loại"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M16 3l11.3 6.5v13L16 29 4.7 22.5v-13z"/><path d="M16 8.5l6.6 3.8v7.6L16 23.7l-6.6-3.8v-7.6z"/></svg></button>
      <button class="tbtn" id="hl" type="button" aria-pressed="false" aria-label="Ẩn/hiện highlight các vị trí đã chọn" title="Ẩn/hiện highlight (chỉ trên thiết bị này)"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><g class="rays"><ellipse cx="16" cy="16" rx="13" ry="5.2"/><ellipse cx="16" cy="16" rx="13" ry="5.2" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="13" ry="5.2" transform="rotate(120 16 16)"/></g><circle cx="16" cy="16" r="2.6" fill="currentColor" stroke="none"/></svg></button>
      <button class="tbtn" id="full" type="button" aria-label="Toàn màn hình" title="Toàn màn hình"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4h8M13 4v8L6 25a2.5 2.5 0 0 0 2.2 3.5h15.6A2.5 2.5 0 0 0 26 25l-7-13V4"/><path d="M9.5 20h13"/><circle cx="15" cy="24" r="1" fill="currentColor"/><circle cx="19.5" cy="23" r="1" fill="currentColor"/></svg></button>
    </div>
    <div class="sync" id="sync" data-s="wait" role="status"><i></i><span>Đang kết nối đồng bộ…</span></div>
  </aside>

  <main class="board"><div class="grid" id="grid"></div></main>
</div>

<script>
/* ====== CẤU HÌNH: dán đường dẫn Firebase Realtime Database vào giữa hai dấu nháy ======
   Ví dụ: "https://ten-du-an-default-rtdb.asia-southeast1.firebasedatabase.app"          */
const DB_URL = "https://gs-center-7b342-default-rtdb.asia-southeast1.firebasedatabase.app";
/* ======================================================================================= */

const EL = [
 ["H","Hydrogen","nm1"],["He","Helium","ng"],["Li","Lithium","alk"],["Be","Beryllium","alke"],
 ["B","Boron","mtl"],["C","Carbon","nm1"],["N","Nitrogen","nm1"],["O","Oxygen","nm1"],
 ["F","Fluorine","hal"],["Ne","Neon","ng"],["Na","Sodium","alk"],["Mg","Magnesium","alke"],
 ["Al","Aluminium","met"],["Si","Silicon","mtl"],["P","Phosphorus","nm1"],["S","Sulfur","nm1"],
 ["Cl","Chlorine","hal"],["Ar","Argon","ng"],["K","Potassium","alk"],["Ca","Calcium","alke"],
 ["Sc","Scandium","tm"],["Ti","Titanium","tm"],["V","Vanadium","tm"],["Cr","Chromium","tm"],
 ["Mn","Manganese","tm"],["Fe","Iron","tm"],["Co","Cobalt","tm"],["Ni","Nickel","tm"],
 ["Cu","Copper","tm"],["Zn","Zinc","tm"]
];
const N = EL.length;
const grid = document.getElementById('grid');
const leftEl = document.getElementById('left');
const syncEl = document.getElementById('sync');
document.getElementById('total').textContent = N;

// Mỗi "phòng" là một bảng riêng: thêm ?room=lop1 vào cuối link. Mặc định là "main".
const room = (new URLSearchParams(location.search).get('room') || 'main').replace(/[^\w-]/g,'').slice(0,40) || 'main';
const ENDPOINT = DB_URL.trim() ? DB_URL.trim().replace(/\/+$/,'') + '/rooms/' + room + '.json' : '';

const cells = [];
let tree = null;                 // bản sao dữ liệu: { sel:{c5:true}, gone:{c3:true} }
let sel = new Set(), gone = new Set();
let prevLeft = N, firstEvent = true, es = null, queue = Promise.resolve();

function status(s){
  const m = {
    live:'Đồng bộ trực tiếp',
    wait:'Đang kết nối đồng bộ…',
    off:'Mất kết nối – đang thử lại…',
    denied:'Không kết nối được Firebase – kiểm tra đường dẫn và Rules',
    local:'Chưa cấu hình Firebase – chỉ chạy trên máy này'
  };
  syncEl.dataset.s = s === 'live' ? 'live' : (s === 'wait' || s === 'local') ? 'wait' : 'off';
  syncEl.querySelector('span').textContent = m[s]; syncEl.title = m[s];
}

function setAt(path, val){
  const p = path.split('/').filter(Boolean);
  if(!p.length){ tree = val; return; }
  if(tree === null || typeof tree !== 'object') tree = {};
  let o = tree;
  for(let k = 0; k < p.length - 1; k++){
    if(o[p[k]] === null || typeof o[p[k]] !== 'object') o[p[k]] = {};
    o = o[p[k]];
  }
  if(val === null || val === undefined) delete o[p[p.length-1]]; else o[p[p.length-1]] = val;
}
function ids(o){
  const s = new Set();
  Object.keys(o || {}).forEach(k=>{ const m = /^c(\d+)$/.exec(k); if(m && +m[1] < N && o[k] === true) s.add(+m[1]); });
  return s;
}
function render(initial){
  sel = ids(tree && tree.sel); gone = ids(tree && tree.gone);
  cells.forEach((c,i)=>{
    const g = gone.has(i), on = !g && sel.has(i);
    c.classList.toggle('sel', on);
    c.setAttribute('aria-pressed', on);
    c.setAttribute('aria-disabled', g);
    if(g){
      if(!c.classList.contains('out')){ c.classList.add('out'); if(initial) c.classList.add('still'); }
    } else c.classList.remove('out','still');
  });
  const left = N - gone.size;
  leftEl.textContent = left;
  if(left !== prevLeft){ leftEl.classList.remove('bump'); void leftEl.offsetWidth; leftEl.classList.add('bump'); prevLeft = left; }
}

// Ghi thay đổi: cập nhật ngay trên máy này, rồi gửi lên Firebase (null = xoá)
function write(changes){
  Object.keys(changes).forEach(p=>setAt('/' + p, changes[p]));
  render();
  if(!ENDPOINT) return;
  queue = queue.then(()=>fetch(ENDPOINT,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(changes)}))
    .then(r=>{ if(!r.ok) throw new Error(r.status); if(syncEl.dataset.s !== 'wait') status('live'); })
    .catch(()=>status('off'));
}
function resetAll(){
  tree = null; render();
  if(!ENDPOINT) return;
  queue = queue.then(()=>fetch(ENDPOINT,{method:'DELETE'})).catch(()=>status('off'));
}

function toggleCell(i){
  if(gone.has(i)) return;
  write({['sel/c' + i]: sel.has(i) ? null : true});
  const d = cells[i];
  d.classList.add('press');
  setTimeout(()=>d.classList.remove('press'),130);
}

EL.forEach(([s,n,c],i)=>{
  const d = document.createElement('div');
  d.className = 'cell ' + c;
  d.setAttribute('role','button'); d.tabIndex = 0;
  d.setAttribute('aria-label', n + ' – vị trí ' + (i+1));
  d.innerHTML = `<span class="num">${i+1}</span><div class="sym">${s}</div><div class="nm">${n}</div>`;
  d.addEventListener('click',()=>toggleCell(i));
  d.addEventListener('keydown',e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleCell(i); } });
  grid.appendChild(d); cells.push(d);
});

// Logo: loại các vị trí đã chọn; nếu tất cả đã bị loại thì khôi phục
document.getElementById('logo').addEventListener('click',()=>{
  if(gone.size === N){ resetAll(); return; }
  if(!sel.size) return;
  const ch = {};
  sel.forEach(i=>{ ch['sel/c' + i] = null; ch['gone/c' + i] = true; });
  write(ch);
});

// Chọn tất cả vị trí chưa bị loại
document.getElementById('all').addEventListener('click',()=>{
  const ch = {};
  cells.forEach((c,i)=>{ if(!gone.has(i) && !sel.has(i)) ch['sel/c' + i] = true; });
  if(Object.keys(ch).length) write(ch);
});

// Ẩn/hiện highlight (chỉ trên thiết bị này, vẫn giữ lựa chọn)
const hl = document.getElementById('hl');
hl.onclick = ()=>{ const off = grid.classList.toggle('hide-sel'); hl.setAttribute('aria-pressed', off); };

// Toàn màn hình: iPhone không hỗ trợ nên ẩn nút ở nơi không dùng được
const root = document.documentElement, fsBtn = document.getElementById('full');
const reqFS = root.requestFullscreen || root.webkitRequestFullscreen;
if(!reqFS) fsBtn.style.display = 'none';
else fsBtn.onclick = ()=>{
  try{
    const p = (document.fullscreenElement || document.webkitFullscreenElement)
      ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
      : reqFS.call(root);
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
};

// ---- Nhận thay đổi trực tiếp từ Firebase (Server-Sent Events) ----
function applyEvent(m, merge){
  if(merge){
    const b = m.path === '/' ? '' : m.path;
    Object.keys(m.data || {}).forEach(k=>setAt(b + '/' + k, m.data[k]));
  } else setAt(m.path, m.data);
  render(firstEvent); firstEvent = false;
}
function connect(){
  if(es) es.close();
  es = new EventSource(ENDPOINT);
  es.onopen = ()=>status('live');
  es.onerror = ()=>status(es.readyState === EventSource.CLOSED ? 'denied' : 'off');
  es.addEventListener('put',  e=>applyEvent(JSON.parse(e.data), false));
  es.addEventListener('patch',e=>applyEvent(JSON.parse(e.data), true));
  es.addEventListener('cancel',       ()=>status('denied'));
  es.addEventListener('auth_revoked', ()=>status('denied'));
}
if(ENDPOINT){
  status('wait'); connect();
  setTimeout(()=>{ if(syncEl.dataset.s === 'wait') status('off'); }, 10000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && es && es.readyState !== EventSource.OPEN) connect(); });
} else status('local');
</script>
</body>
</html>
